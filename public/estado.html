<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafetería U — Mis Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .refresh-btn { animation: none; }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-summary { display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px; }
    .status-stat { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 20px;flex:1;min-width:120px; }
    .status-stat-num { font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--accent); }
    .status-stat-label { font-size:0.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px; }
    .order-card { cursor:default; }
    .order-meta { display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap; }
  </style>
</head>
<body>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<div class="bg-mesh"></div>
<div class="toast-container" id="toastContainer"></div>

<nav class="floating-nav" id="floatingNav">
  <div class="nav-brand"><span class="dot"></span> Cafetería U</div>
  <span class="nav-user" id="navUser"></span>
  <div class="nav-actions">
    <a class="btn btn-ghost btn-sm btn-cart" href="carrito.html">
      🛒 Carrito<span class="cart-count" id="cartBadge">0</span>
    </a>
    <a class="btn btn-primary btn-sm" href="menu.html">Pedir más +</a>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
  </div>
</nav>

<div class="page">
  <div class="container status-page">
    <div class="page-hero" style="padding:110px 0 32px">
      <div class="page-hero-label">Seguimiento</div>
      <h1 class="page-hero-title">Mis <span style="color:var(--accent)">pedidos</span></h1>
      <p class="page-hero-sub">Actualización automática cada 20 segundos</p>
    </div>

    <div class="status-summary" id="statsSummary" style="display:none">
      <div class="status-stat"><div class="status-stat-num" id="statTotal">0</div><div class="status-stat-label">Total pedidos</div></div>
      <div class="status-stat"><div class="status-stat-num" id="statPending" style="color:var(--accent2)">0</div><div class="status-stat-label">En proceso</div></div>
      <div class="status-stat"><div class="status-stat-num" id="statDone">0</div><div class="status-stat-label">Completados</div></div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px">
      <h2 class="section-title" style="font-size:1.2rem">Historial de órdenes</h2>
      <button class="btn btn-ghost btn-sm refresh-btn" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
    </div>

    <div class="orders-list" id="ordersList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/app.js" defer></script>
<script>
  const STEPS = ['pendiente','en_preparacion','listo','entregado'];
  const STEP_LABELS = ['Recibido','Preparando','Listo','Entregado'];
  const STATUS_LABELS = { pendiente:'Pendiente', en_preparacion:'En preparación', en_preparacion2:'En preparación', listo:'¡Listo!', entregado:'Entregado', cancelado:'Cancelado' };

  function getStatusClass(s){ return 'status-'+s.replace(/ /g,'_').replace('é','e'); }
  function getStatusLabel(s){ return STATUS_LABELS[s]||s; }

  document.addEventListener('DOMContentLoaded', async()=>{
    const user=getUser();
    if(!user){window.location.href='index.html';return;}
    if(user.tipo==='cafeteria'){window.location.href='admin.html';return;}
    document.getElementById('navUser').textContent='👤 '+user.nombre;
    updateCartBadge();
    await loadOrders();
    // Auto-refresh every 20s
    setInterval(loadOrders, 20000);

    document.getElementById('refreshBtn').addEventListener('click',async()=>{
      const btn=document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      await loadOrders();
      setTimeout(()=>btn.classList.remove('spinning'),800);
    });
    window.addEventListener('scroll',()=>{
      document.getElementById('floatingNav').classList.toggle('scrolled',window.scrollY>60);
    },{passive:true});
    initCursor();
  });

  async function loadOrders(){
    try {
      const user=getUser();
      const res=await authFetch('/pedido-usuario/'+user.id);
      if(!res.ok) throw new Error('Error al cargar pedidos');
      const orders=await res.json();
      // Fetch items for each order (parallel)
      const ordersWithItems = await Promise.all(orders.map(async order=>{
        try {
          const ir=await authFetch('/pedido/'+order.id);
          const items=await ir.json();
          return {...order, items: Array.isArray(items)?items:[]};
        } catch(e){ return {...order, items:[]}; }
      }));
      renderOrders(ordersWithItems);
    } catch(e){ renderOrders([]); }
  }

  function renderOrders(orders){
    const list=document.getElementById('ordersList');
    const stats=document.getElementById('statsSummary');

    if(!orders.length){
      list.innerHTML=`<div class="empty-state"><div class="icon">📋</div><p>No tienes pedidos todavía.<br><a href="menu.html">Explora el menú y haz tu primer pedido →</a></p></div>`;
      stats.style.display='none'; return;
    }
    stats.style.display='flex';
    const pending=orders.filter(o=>!['entregado','cancelado'].includes(o.estado));
    const done=orders.filter(o=>o.estado==='entregado');
    document.getElementById('statTotal').textContent=orders.length;
    document.getElementById('statPending').textContent=pending.length;
    document.getElementById('statDone').textContent=done.length;

    list.innerHTML='';
    orders.forEach((order,i)=>{
      const statusClass=getStatusClass(order.estado||'pendiente');
      const currentStepIdx=STEPS.indexOf(order.estado)||0;
      const items=Array.isArray(order.items)?order.items:[];

      const card=document.createElement('div');
      card.className='order-card';
      card.style.opacity='0';

      const progressHTML=STEPS.map((step,si)=>{
        const isDone=si<currentStepIdx;
        const isCurrent=si===currentStepIdx;
        return `<div class="progress-step ${isDone?'done':''} ${isCurrent?'current':''}">
          <div class="step-dot">${isDone?'✓':si+1}</div>
          <div class="step-label">${STEP_LABELS[si]}</div>
        </div>`;
      }).join('');

      const itemsHTML=items.map(it=>`
        <div class="order-item-row">
          <span><strong>${esc(it.producto_nombre||it.nombre||'Producto')}</strong> × ${it.cantidad}</span>
          <span>${money(it.precio_unitario*it.cantidad)}</span>
        </div>`).join('');

      const dateStr=order.fecha?new Date(order.fecha).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'';

      card.innerHTML=`
        <div class="order-card-header">
          <div class="order-meta">
            <div class="order-id">Pedido #${order.id}</div>
            <div class="order-date">${dateStr}</div>
          </div>
          <span class="order-status ${statusClass}">${getStatusLabel(order.estado)}</span>
        </div>
        <div class="order-body">
          ${items.length?`<div class="order-items-list">${itemsHTML}</div>`:''}
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:0.78rem;color:var(--text3)">${items.length} producto${items.length!==1?'s':''}</span>
            <div class="order-total">${money(order.total)}</div>
          </div>
          ${order.estado!=='cancelado'?`<div class="order-progress">${progressHTML}</div>`:''}
        </div>`;

      list.appendChild(card);
      gsap.to(card,{opacity:1,y:0,duration:0.45,delay:i*0.08,ease:'power2.out',
        onStart:()=>{card.style.transform='translateY(20px)';card.classList.add('revealed');}});
    });
  }

  function initCursor(){
    const dot=document.getElementById('cursor-dot'),ring=document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
    (function l(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(l);})();
    document.querySelectorAll('a,button,.btn').forEach(el=>{
      el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));
    });
    document.addEventListener('mousedown',()=>document.body.classList.add('cursor-click'));
    document.addEventListener('mouseup',()=>document.body.classList.remove('cursor-click'));
  }
</script>
</body>
</html>
